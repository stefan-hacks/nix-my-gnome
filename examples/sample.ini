[org/gnome/desktop/interface]
clock-format='12h'
enable-animations=true
scaling-factor=uint32 1
text-scaling-factor=1.0

[org/gnome/desktop/input-sources]
mru-sources=[('xkb', 'us'), ('xkb', 'gb')]
xkb-options=@as []

[org/gnome/shell]
enabled-extensions=['dash-to-dock@micxgx.gmail.com', 'user-theme@gnome-shell-extensions.gcampax.github.com']
favorite-apps=['firefox.desktop', 'org.gnome.Console.desktop']

[org/gnome/shell/extensions/dash-to-dock]
dock-position='BOTTOM'
transparency-mode='DYNAMIC'

[org/virt-manager/virt-manager]
manager-window-height=550
manager-window-width=550
